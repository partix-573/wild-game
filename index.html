<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WildWest MATRIX — Halloween Edition</title>
    
    <!-- PWA / Web App Settings -->
    <meta name="theme-color" content="#ff7518">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WildWest">
    <link rel="manifest" id="manifest-placeholder">

    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper-bg: #e6d5b8;
            --paper-border: #3b2a1a;
            --ink: #1a120b;
            --ink-faded: #4a3828;
            --body-bg: #2b1f14;
        }

        /* Набор шрифтов интерфейса */
        body.font-western { font-family: 'Special Elite', cursive, monospace; }
        body.font-classic { font-family: Georgia, 'Times New Roman', serif; }
        body.font-modern { font-family: Arial, Helvetica, sans-serif; }
        body.font-rounded { font-family: 'Trebuchet MS', Verdana, sans-serif; }
        body.font-mono { font-family: 'Courier New', Courier, monospace; }
        body.font-serif { font-family: Cambria, Georgia, serif; }
        body.font-elegant { font-family: 'Palatino Linotype', Palatino, serif; }
        body.font-heavy { font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; }
        body.font-readable { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body[class*="font-"] button, body[class*="font-"] input,
        body[class*="font-"] select, body[class*="font-"] textarea { font-family: inherit; }

        /* Темы оформления */
        body.theme-parchment {
            --paper-bg: #e6d5b8;
            --paper-border: #3b2a1a;
            --ink: #1a120b;
            --ink-faded: #4a3828;
            --body-bg: #2b1f14;
        }

        body.theme-dark {
            --paper-bg: #181512;
            --paper-border: #5e4835;
            --ink: #d4c5b9;
            --ink-faded: #8c7866;
            --body-bg: #0d0a08;
        }

        body.theme-blood {
            --paper-bg: #d1b2a5; --paper-border: #4d1c1c; --ink: #2b0808;
            --ink-faded: #6e3030; --body-bg: #3b1010;
        }
        body.theme-gold {
            --paper-bg:#241900; --paper-border:#ffd447; --ink:#ffe9a3;
            --ink-faded:#e8b92e; --body-bg:#090700;
        }
        body.theme-ocean { --paper-bg:#d6f1f2; --paper-border:#075b70; --ink:#063846; --ink-faded:#287c8b; --body-bg:#092d3a; }
        body.theme-forest { --paper-bg:#dce7c8; --paper-border:#31532a; --ink:#172b15; --ink-faded:#55734b; --body-bg:#122014; }
        body.theme-purple { --paper-bg:#e6d9f4; --paper-border:#673b8d; --ink:#2b1240; --ink-faded:#8059a0; --body-bg:#1b0c29; }
        body.theme-rose { --paper-bg:#ffe0e8; --paper-border:#a52f57; --ink:#4a1026; --ink-faded:#a34c6c; --body-bg:#35101f; }
        body.theme-gold .parchment, body.theme-gold button, body.theme-gold .member-card {
            box-shadow: 0 0 8px #ffd447, 0 0 22px rgba(255,212,71,.35), inset 0 0 18px rgba(255,212,71,.12);
        }
        /* Хеллоуинская тема MATRIX */
        body.theme-halloween {
            --paper-bg: #20152a; --paper-border: #ff7518; --ink: #fff0d5;
            --ink-faded: #ffad42; --body-bg: #0b0710;
        }
        body.theme-halloween .parchment {
            background-image: radial-gradient(circle at 15% 10%, rgba(255,117,24,.18), transparent 32%), radial-gradient(circle at 90% 90%, rgba(126,54,180,.22), transparent 35%);
            box-shadow: 0 0 14px rgba(255,117,24,.28), inset 0 0 30px rgba(126,54,180,.12);
        }
        body.theme-halloween .parchment::after {
            content: '🎃  👻  🦇'; position: absolute; top: 7px; right: 14px; font-size: 18px; pointer-events: none;
        }
        body.theme-halloween button { border-color: #ff7518; }
        body.theme-halloween .member-card, body.theme-halloween .profile-stat { border-color: #ff7518; }
        body.theme-halloween h1, body.theme-halloween h2, body.theme-halloween h3 { color: #ffad42; text-shadow: 0 0 8px rgba(255,117,24,.25); }

        .small-note { font-size:12px; opacity:.8; }
        .profile-stat { border:1px dashed var(--ink); padding:12px; margin:8px 0; }
        .level-track { height:16px; border:2px solid var(--ink); background:rgba(0,0,0,.12); margin:8px 0; overflow:hidden; }
        .level-fill { height:100%; width:0%; background:linear-gradient(90deg,#d69b00,#fff0a0); transition:width .25s; }
        #account-screen { max-width:500px; margin:auto; }
        .hidden { display:none !important; }

        .btn-install-pwa {
            background: linear-gradient(135deg, #ff7518, #ffad42);
            color: #0d0a08;
            font-size: 16px;
            border: 2px solid #fff0d5;
            box-shadow: 0 0 15px rgba(255, 117, 24, 0.5);
            margin: 15px 0;
            padding: 14px;
            width: 100%;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 12px;
        }

        body {
            background-color: var(--body-bg);
            color: var(--ink);
            font-family: 'Special Elite', cursive, monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .parchment {
            background-color: var(--paper-bg);
            background-image: radial-gradient(circle, rgba(0,0,0,0.03) 0%, rgba(0,0,0,0.12) 100%);
            border: 4px solid var(--paper-border);
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), inset 0 0 40px rgba(80, 50, 20, 0.2);
            width: 100%;
            max-width: 650px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .parchment::before {
            content: '';
            position: absolute;
            top: 4px; left: 4px; right: 4px; bottom: 4px;
            border: 1px dashed var(--ink-faded);
            pointer-events: none;
            opacity: 0.6;
        }

        h1, h2, h3 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid var(--ink);
            padding-bottom: 8px;
            margin-top: 0;
        }

        .screen { display: none; }
        .screen.active { display: block; }

        input, select, button {
            font-family: 'Special Elite', cursive, monospace;
            background: transparent;
            border: 2px solid var(--ink);
            color: var(--ink);
            padding: 8px 12px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 10px;
            transition: border-color 0.3s, color 0.3s;
        }

        input, select {
            width: 100%;
            background-color: rgba(255,255,255,0.1);
        }

        button {
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            width: 100%;
            background-color: rgba(0,0,0,0.05);
            transition: all 0.2s;
            box-shadow: 2px 2px 0px var(--ink);
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .tabs {
            display: flex;
            gap: 3px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tabs button {
            flex: 1;
            padding: 4px;
            font-size: 10px;
        }
        .tabs button.active-tab {
            background-color: var(--ink);
            color: var(--paper-bg);
            box-shadow: none;
        }

        .member-card {
            border: 2px dashed var(--ink);
            padding: 12px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.05);
        }
        .member-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 17px;
            font-weight: bold;
        }
        .points-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .points-controls input {
            margin-bottom: 0;
            width: 70px;
            text-align: center;
        }
        .points-controls button {
            width: auto;
            padding: 6px 10px;
            margin-bottom: 0;
        }
        .class-badge {
            font-size: 13px;
            border: 1px solid var(--ink);
            padding: 2px 6px;
            background: rgba(0,0,0,0.05);
            display: inline-block;
            margin-top: 5px;
        }

        .classes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            align-items: stretch;
        }
        .class-box, .monster-box, .settings-box {
            border: 2px solid var(--ink);
            border-radius: 8px;
            padding: 12px;
            background: rgba(10, 5, 16, .72);
            color: var(--ink);
            margin-bottom: 0;
            min-width: 0;
            overflow: hidden;
        }
        .class-box h3, .monster-box h3, .settings-box h3 {
            margin-top: 9px;
            font-size: 17px;
            text-align: left;
            border-bottom: 1px solid var(--ink);
            overflow-wrap: anywhere;
        }
        .character-portrait {
            display: block;
            width: min(100%, 180px);
            aspect-ratio: 1 / 1;
            object-fit: cover;
            object-position: center;
            border: 3px solid #ff7518;
            border-radius: 10px;
            margin: 0 auto 10px;
            background: #120b18;
            filter: saturate(1.08) contrast(1.04);
            box-shadow: 0 0 12px rgba(255,117,24,.28);
        }

        .ability-list {
            margin-top: 10px;
            padding-left: 20px;
            font-size: 14px;
        }
        .ability-list li {
            margin-bottom: 6px;
        }

        .timer-display {
            font-size: 40px;
            text-align: center;
            border: 3px solid var(--ink);
            padding: 15px;
            background: rgba(0,0,0,0.05);
            margin-bottom: 15px;
            letter-spacing: 3px;
        }
        .roulette-box {
            border: 2px dashed var(--ink);
            padding: 15px;
            text-align: center;
            background: rgba(255,255,255,0.08);
            margin-top: 15px;
        }
        .monster-name {
            font-size: 24px;
            font-weight: bold;
            color: #b22222;
            margin: 10px 0;
            min-height: 30px;
        }
    </style>
</head>
<body class="theme-halloween">

<div class="parchment">
    
    <div id="account-screen" class="screen active">
        <h1>Вход в аккаунт</h1>
        <p>Создай аккаунт или войди, чтобы сохранить прогресс на этом устройстве.</p>
        
        <button id="pwa-install-btn-main" class="btn-install-pwa hidden" onclick="triggerPWAInstall()">📱 УСТАНОВИТЬ НА ТЕЛЕФОН</button>

        <label>Никнейм</label><input id="account-name" autocomplete="username" placeholder="Придумай никнейм">
        <label>Пароль</label><input id="account-password" type="password" autocomplete="current
